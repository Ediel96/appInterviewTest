plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
	id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'MiniStore API'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '2.9.1'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

jacocoTestReport {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}

sonar {
	properties {
		property 'sonar.projectKey', 'ministore-backend'
		property 'sonar.projectName', 'MiniStore Backend'
		property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'http://localhost:9000'
		property 'sonar.coverage.jacoco.xmlReportPaths', layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile
		property 'sonar.exclusions', '**/build/**'
		property 'sonar.coverage.exclusions', '**/HamiltonApplication.java,**/configuration/**,**/config/**,**/dto/**'
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('test'), tasks.named('jacocoTestReport')
}

openApi {
	apiDocsUrl.set('http://localhost:8080/v3/api-docs')
	outputDir.set(file("$buildDir/docs"))
	outputFileName.set('openapi.json')
	waitTimeInSeconds.set(30)
}
