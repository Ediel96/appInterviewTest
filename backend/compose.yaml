services:
  backend:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      DUMMYJSON_API_BASE_URL: ${DUMMYJSON_API_BASE_URL:-https://dummyjson.com}
      DUMMYJSON_API_TIMEOUT: ${DUMMYJSON_API_TIMEOUT:-10000}
      OPENAPI_SERVER_URL: ${OPENAPI_SERVER_URL:-http://localhost:8080}
    restart: unless-stopped

  sonar-db:
    image: postgres:17-alpine
    profiles: ["sonar"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    profiles: ["sonar"]
    depends_on:
      sonar-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  sonar_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
